<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mercado Local, comercio electrónico de productos de productores cercanos." />
    <title>Mercado Local | Productos cercanos</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
  </head>
  <body>
    <!-- Permite que las personas que usan teclado lleguen directamente al contenido. -->
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <!-- Encabezado y navegación que se conservan entre cambios de vista. -->
    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="Mercado Local, ir al inicio">
        <span>Mercado Local</span>
        <small>Comercio cercano</small>
      </a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#inicio" data-route="inicio">Inicio</a>
        <a href="#explorar" data-route="explorar">Explorar</a>
        <a href="#carrito" data-route="carrito">Carrito <span id="cart-count" class="cart-count" aria-live="polite">0</span></a>
        <a href="#opciones" data-route="opciones">Opciones</a>
      </nav>
      <a class="button button-primary account-button" id="account-link" href="#login" data-route="login">Iniciar sesión</a>
    </header>

    <!-- El contenido de #app se actualiza desde app.js según el hash de la URL. -->
    <div class="app-layout">
      <aside class="sidebar" aria-label="Atajos de Mercado Local">
        <p class="sidebar-label">Explora Mercado Local</p>
        <nav aria-label="Navegación lateral">
          <a href="#inicio" data-route="inicio">Inicio</a>
          <a href="#explorar" data-route="explorar">Explorar</a>
          <a href="#carrito" data-route="carrito">Mi carrito</a>
          <a href="#pedidos" data-route="pedidos">Mis pedidos</a>
          <a href="#opciones" data-route="opciones">Opciones</a>
        </nav>
        <section class="a11y-note" aria-labelledby="a11y-title">
          <h2 id="a11y-title">Accesibilidad</h2>
          <p>Foco visible, texto claro y uso completo con teclado.</p>
        </section>
      </aside>

      <main id="main-content" tabindex="-1">
        <div id="status-message" class="visually-hidden" role="status" aria-live="polite"></div>
        <noscript><p class="notice error">Activa JavaScript para usar Mercado Local.</p></noscript>
        <div id="app"></div>
      </main>
    </div>

    <div id="toast-message" class="toast-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>

    <!-- El orden de carga es importante: datos, persistencia, acceso, accesibilidad e interfaz. -->
    <script src="js/catalog.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/a11y.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
